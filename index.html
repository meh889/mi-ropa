<!doctype html>
<html lang="es-AR" data-skin="stickers">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>¿Dónde está mi súper traje?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@500;600;700&display=swap">
<style>
/* Layout: a closet rail. Sticky tab bar on top, garments shown as hang tags in a wrapping grid, dialogs for editing. */
:root {
  --bg: #f5f2f6;
  --surface: #ffffff;
  --sunk: #ece6ee;
  --ink: #2a1f2d;
  --muted: #65576b;
  --line: #ddd3e1;
  --accent: #b81f57;
  --accent-soft: #f7dce6;
  --accent-ink: #ffffff;
  --ok: #2f7a4a;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(42, 31, 45, .06), 0 6px 18px -10px rgba(42, 31, 45, .25);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --nav-h: calc(62px + env(safe-area-inset-bottom, 0px)); /* bottom tab bar, home indicator included */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17111a; --surface: #221a26; --sunk: #2b2230; --ink: #f2ebf4; --muted: #a797ad;
    --line: #3a2f40; --accent: #ff5d94; --accent-soft: #3f1d2c; --accent-ink: #1b0d13;
    --ok: #6fcf93; --warn: #f0b45a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17111a; --surface: #221a26; --sunk: #2b2230; --ink: #f2ebf4; --muted: #a797ad;
  --line: #3a2f40; --accent: #ff5d94; --accent-soft: #3f1d2c; --accent-ink: #1b0d13;
  --ok: #6fcf93; --warn: #f0b45a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 32px);
}
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; padding-block: 28px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 46px; height: 46px; flex: none; color: var(--accent); }
.brand h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.summary { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

/* Tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabs-inner { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 520px; margin: 0 auto; }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; height: 50px; padding: 0; border: 0; background: transparent; border-radius: 14px; cursor: pointer; color: var(--ink); font-size: 10.5px; font-weight: 700; letter-spacing: .02em; }
.tab-ico { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 999px; transition: background-color .15s ease; }
.tab-ico svg { width: 23px; height: 23px; }
.tab-txt { line-height: 1.1; }
.tab[aria-selected="true"] .tab-ico { background: var(--ink); color: var(--bg); }
.tab .n { display: none; } /* the counts already sit in the pill above */
@media (prefers-reduced-motion: reduce) { .tab-ico { transition: none; } }

/* Generic controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 32px; padding: 5px 12px; font-size: 13.5px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-height: 42px; font-size: 16px;
}
textarea { resize: vertical; min-height: 70px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(127,127,127,.45); flex: none; display: inline-block; }
.dot.estampado { background: conic-gradient(#e45b8a, #f2c94c, #4fb08a, #5a7fe0, #e45b8a); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toolbar h2 { font-size: 26px; font-weight: 700; }
.toolbar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; justify-content: space-between; border: 1px dashed var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
.banner strong { color: var(--ink); }

/* Filters */
.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 14px; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.buscar { position: relative; display: block; }
.buscar svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.buscar input { padding-left: 42px; }
.fpills { display: flex; flex-wrap: wrap; gap: 6px; }
.fpill { display: inline-flex; align-items: center; gap: 5px; min-height: 38px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; max-width: 100%; }
.fpill.activo { background: var(--accent-soft); }
.fpill[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.fpill-flecha { font-size: 11px; opacity: .7; }
.fpill-casa { position: relative; }
.fpill-casa select { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; font-size: 16px; cursor: pointer; }
.faceta-opciones { display: grid; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.faceta-opciones .label { padding-top: 6px; }
.filter-count { margin: -4px 0 12px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.filters .group { display: grid; gap: 6px; min-width: 0; }
.facetas { display: grid; gap: 12px; min-width: 0; }
.facetas:empty { display: none; }


/* Hang tag cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 18px 14px; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.tag {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px var(--r) var(--r);
  box-shadow: var(--shadow); text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  transition: transform .18s ease, box-shadow .18s ease;
}
@media (hover: hover) { .tag:hover { transform: translateY(-2px) rotate(-.4deg); } }
.tag .pic img, .collage img { -webkit-touch-callout: none; }
button { -webkit-user-select: none; user-select: none; }
.tag::before { /* the punched hole of a hang tag */
  content: ""; position: absolute; top: 9px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line); z-index: 2;
}
.tag .pic { aspect-ratio: 4 / 5; max-width: 100%; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.tag .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag .pic svg { width: 54%; height: auto; }
.tag .body { padding: 10px 12px 12px; display: grid; gap: 5px; min-width: 0; }
.tag .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.tag .meta { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.tag .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.tag .dots { display: flex; gap: 3px; flex: none; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill.ex { background: transparent; border: 1px dashed var(--line); }
.tag.selectable[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.tag.selectable[aria-pressed="true"] .check { display: grid; }
.check { display: none; position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); place-items: center; z-index: 3; font-weight: 700; }
.tag.mini .body { padding: 8px 10px 10px; }
.tag.mini .name { font-size: 13.5px; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 20px; }
.empty p { margin: 0; max-width: 46ch; }

/* Armarios */
.closets { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.closet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.closet .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.closet h3 { font-size: 22px; overflow-wrap: anywhere; }
.closet .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: flex; gap: 6px; height: 64px; align-items: flex-end; border-top: 3px solid var(--ink); padding-top: 4px; overflow: hidden; }
.rail .hang { width: 22px; flex: none; border-radius: 3px 3px 6px 6px; border: 1px solid rgba(127,127,127,.35); }
.rail .none { font-size: 13px; color: var(--muted); align-self: center; }
.closet .row { display: flex; flex-wrap: wrap; gap: 6px; }
.closet.new { border-style: dashed; background: transparent; align-content: start; }

/* Outfits */
.outfits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.outfit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
.collage { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 2px; background: var(--line); aspect-ratio: 4 / 3; max-width: 100%; }
.collage > div { background: var(--sunk); display: grid; place-items: center; overflow: hidden; min-height: 0; }
.collage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.collage svg { width: 46%; max-height: 80%; }
.outfit .body { padding: 12px 14px 14px; display: grid; gap: 8px; }
.outfit h3 { font-size: 19px; overflow-wrap: anywhere; }
.outfit .occ { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.outfit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.outfit li { display: flex; gap: 8px; align-items: center; min-width: 0; }
.outfit li span:last-child { overflow-wrap: anywhere; }
.outfit .note { font-size: 14px; color: var(--muted); margin: 0; }
.outfit .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding: 0 14px 14px; }

/* Builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 820px) { .builder { grid-template-columns: 1fr; } }
.tray { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 44px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
@media (max-width: 820px) { .tray { position: static; order: -1; } }
.tray ol { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 2px; }
.tray .hint { font-size: 13.5px; color: var(--muted); margin: 0; }
.tray-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.tray-list li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tray-nombre { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* Generator */
.gen { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .gen { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 16px; }
.temp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.temp input { text-align: center; font-family: var(--f-mono); }
.thermo { height: 8px; border-radius: 999px; background: linear-gradient(90deg, #5a8fe0, #8ec5ea 35%, #f2c94c 65%, #ef7d32); position: relative; }
.thermo .sel { position: absolute; top: -3px; bottom: -3px; border: 2px solid var(--ink); border-radius: 999px; }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks .c { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.results { display: grid; gap: 14px; }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--accent); }
.engine { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }

/* Dialog */
dialog { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(23, 17, 26, .5); }
dialog form { display: grid; gap: 16px; padding: 20px; }
dialog h2 { font-size: 24px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.photo-pick { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.photo-pick .pv { aspect-ratio: 4 / 5; max-width: 100%; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.photo-pick .pv img { width: 100%; height: 100%; object-fit: cover; }
.photo-pick .pv svg { width: 60%; }
.photo-pick .ctrl { display: grid; gap: 8px; justify-items: start; font-size: 13.5px; color: var(--muted); }
.care { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.dlg-foot .r { display: flex; gap: 8px; margin-left: auto; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { .tag { transition: none; } .tag:hover { transform: none; } }

/* Editable lists: inline "new" forms, removable chips, facet counts */
.nuevo { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--sunk); }
.nuevo .row { display: flex; flex-wrap: wrap; gap: 8px; }
.nuevo-box:empty { display: none; }
.color-pick input[type="color"] { width: 72px; height: 42px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.chip.add { border-style: dashed; }
.chip .n { font-size: 11px; opacity: .65; margin-left: 2px; font-variant-numeric: tabular-nums; }
.lchip { cursor: default; padding-right: 4px; }
.lchip .cat { font-size: 11px; color: var(--muted); margin-left: 2px; }
.chip-x { border: 0; background: transparent; color: inherit; font-size: 18px; line-height: 1; padding: 0 4px; margin-left: 2px; cursor: pointer; opacity: .6; min-width: 24px; min-height: 24px; }
.chip-x:hover { opacity: 1; }
.lista { display: grid; gap: 8px; }
.lista-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.lista h4 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.lista .confirm { margin: 0; }

/* Greeting, current house, moving garments, outfit availability */
.saludo { flex-basis: 100%; margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.top-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.aca { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.aca select { width: auto; min-height: 36px; padding: 4px 34px 4px 14px; font-weight: 700; font-size: 16px; text-transform: none; letter-spacing: 0; } /* 16px keeps iOS from zooming in */
.movebar { position: fixed; left: 0; right: 0; bottom: var(--nav-h); z-index: 20; background: var(--ink); color: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.movebar-in { max-width: 1120px; margin: 0 auto; display: grid; gap: 8px; }
.movebar .chips { flex-wrap: wrap; }
.movebar .chip { flex: none; }
.movebar .chip:disabled { opacity: .45; cursor: not-allowed; }
.mover-espacio { height: 150px; }
.estado { margin: 0; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.estado.ok { font-weight: 700; }
.outfit li.lejos .casa { font-weight: 700; color: var(--ink); }

.copia-box { display: grid; gap: 12px; padding: 22px; }
.copia-box p { margin: 0; }
#dlg-copia { width: min(420px, calc(100vw - 24px)); }

/* Weather and house locations */
.clima { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); min-width: 0; }
.clima-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.clima-ubic { font-size: 13px; }
.clima-res { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 17px; }
.clima-ico { font-size: 28px; line-height: 1; }

/* First-use tutorial */

.tuto-sticker svg { width: 58px; height: 58px; }
.tuto-saltar { position: absolute; top: 12px; right: 12px; }
.tuto-cuerpo { padding: 20px 22px 6px; display: grid; gap: 10px; animation: tuto-in .25s ease-out; }
.tuto-cuerpo p { margin: 0; font-size: 16px; line-height: 1.45; }
.tuto-cuerpo .tuto-nota { font-size: 14px; color: var(--muted); }

.tuto-pasos { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 16px; line-height: 1.4; }

.tuto-dots { display: flex; gap: 6px; }
.tuto-dots span { width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); transition: width .2s ease; }
.tuto-dots span.on { width: 20px; background: var(--ink); }
.tuto-botones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-left: auto; }
@keyframes tuto-pop { from { transform: rotate(-8deg) scale(.6); opacity: 0; } }
@keyframes tuto-in { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .tuto-sticker, .tuto-cuerpo { animation: none; } .tuto-dots span { transition: none; } }

/* ================= Stickers look (light only), applied through data-skin="stickers" on <html>. ================= */
.slush-only { display: none; }

/* --- Skin "stickers": pastel paper, crushed poster type, 1px black outlines, a shared sticker palette --- */
:root[data-skin="stickers"] {
  --bg: #dceeff; --surface: #ffffff; --sunk: #e9e9e9; --ink: #000000; --muted: #3a3a3a; --line: #000000;
  --accent: #000000; --accent-soft: #e9ccff; --accent-ink: #ffffff; --ok: #000000; --warn: #fb4903; --shadow: none; --r: 20px;
  --st-blue: #4da2ff; --st-mint: #55db9c; --st-lav: #e9ccff; --st-ember: #fb4903; --st-sun: #ffd731; --st-violet: #5c4ade;
  --f-display: "Bowlby One", "Arial Black", Impact, system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[data-skin="stickers"] body { font-weight: 500; letter-spacing: -0.01em; font-feature-settings: "tnum"; }
[data-skin="stickers"] .slush-only { display: block; }
[data-skin="stickers"] .marquee {
  position: sticky; top: 0; z-index: 12;
  overflow: hidden; background: #000; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .032em; text-transform: uppercase;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px; white-space: nowrap;
}
/* Own GPU layer and a 3D translate: keeps the scrolling text from flickering on iPhone. */
[data-skin="stickers"] .marquee-track { display: inline-flex; animation: marquee 28s linear infinite; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translate3d(0, 0, 0); }
[data-skin="stickers"] .marquee-track span { padding-right: 2em; }
@keyframes marquee { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
@media (prefers-reduced-motion: reduce) { [data-skin="stickers"] .marquee-track { animation: none; } }
[data-skin="stickers"] header.top { position: relative; padding-block: 18px 16px; }
/* Title in exactly two lines: "¿DÓNDE ESTÁ MI" and the two stickers; the hanger sits at the end of line two. */
[data-skin="stickers"] .brand { display: block; position: relative; flex: 1 0 100%; }
[data-skin="stickers"] .brand svg { position: absolute; right: 0; bottom: -8px; width: 52px; height: 52px; padding: 8px; background: var(--st-sun); border: 1px solid #000; border-radius: 50%; color: #000; transform: rotate(-12deg); stroke-width: 2.4; }
/* Line-height is a bit looser than .8 here so the accents in DÓNDE and ESTÁ don't run into the line above. */
[data-skin="stickers"] .brand h1 { font-weight: 400; text-transform: uppercase; font-size: clamp(24px, 8.4vw, 54px); line-height: .95; letter-spacing: 0; }
[data-skin="stickers"] .brand h1 :is(.l1, .l2) { display: block; white-space: nowrap; }
[data-skin="stickers"] .brand h1 .l2 { margin-top: .16em; }
/* On a wide screen (Mac) the hanger follows "TRAJE?" instead of sitting at the far right. */
@media (min-width: 700px) { [data-skin="stickers"] .brand svg { position: static; display: inline-block; vertical-align: middle; margin-left: .25em; width: 1.3em; height: 1.3em; padding: .2em; } }
[data-skin="stickers"] .brand h1 :is(.st1, .st2) { position: relative; color: #000; display: inline-block; border: 1px solid #000; border-radius: 16px; padding: .08em .14em 0; white-space: nowrap; }
[data-skin="stickers"] .brand h1 .st1 { background: var(--st-lav); transform: rotate(-3deg); }

<script>
(() => {
  // ---------- Vocabulary ----------
  // Types, colors and styles are editable lists (state.tipos / colores / estilos); these are the starting sets.
  // Garments refer to them by name. A type's category tells the outfit generator what part of an outfit it is.
  const CATEGORIAS = [
    ["arriba", "Parte de arriba"], ["capa", "Capa (suéter, buzo, saco)"], ["abrigo", "Abrigo"],
    ["abajo", "Parte de abajo"], ["entero", "Vestido o enterito"], ["calzado", "Calzado"], ["accesorio", "Accesorio"],
  ];
  const TIPOS_INICIALES = [
    ["Remera", "arriba"], ["Camisa", "arriba"], ["Top", "arriba"],
    ["Suéter", "capa"], ["Buzo", "capa"], ["Saco", "capa"],

      if (state.mode === "local") { await idb.put(col, { id, ...data }); copia.cambio(); if (!state.persistido) pedirPersistencia(); }
      state[col].push({ id, ...data }); render(); return id;
    },
    async update(col, id, data) {
      if (db) return db.collection(col).doc(id).update(data);
      const it = state[col].find((x) => x.id === id); if (!it) return;
      if (state.mode === "local") { await idb.put(col, { ...it, ...data }); copia.cambio(); }
      Object.assign(it, data);
      render();
    },
    async remove(col, id) {
      if (db) return db.collection(col).doc(id).delete();
      if (state.mode === "local") { await idb.del(col, id); copia.cambio(); }
      state[col] = state[col].filter((x) => x.id !== id); render();
    },
  };
  const esLleno = (e) => !!e && (e.name === "QuotaExceededError" || e.code === "quota_exceeded" || e.code === "quota_or_state");
  async function guard(fn, okMsg) {

  }

  const armarioNombre = (id) => (state.armarios.find((a) => a.id === id) || {}).nombre || "Sin armario";
  const prendaById = (id) => state.prendas.find((p) => p.id === id);

  // ---------- The house she's in, moving garments, what each outfit needs ----------

  const acaNombre = () => armarioNombre(ui.aca);
  // Point the garment filter, the outfit builder and the generator at the current house.

  async function moverPrendas(ids, destino) {

  // ---------- Greetings and the phrase of the day ----------
  const SALUDOS = {
    manana: ["Buen día, Sofi ☀️ ¿Qué nos ponemos hoy?", "Arriba, dormilona: el placard no se elige solo", "Buen día, hermosa. Primero café, después outfit", "Buen día, Sofi. Hoy es un gran día para estrenar algo"],

    siempre: ["Hola, Sofi 💖", "Llegó la más linda de todas las casas", "Hola, diosa. Tu ropa te extrañaba", "Sofi, el placard te saluda (y el perchero también)", "Hola, mi amor. ¿Qué te ponés hoy?", "¿Otra vez nada que ponerse? Mentira, mirá todo lo que tenés", "Bienvenida, Sofi. Acá nada se pierde, solo cambia de casa"],

  function elegirSaludo() {

  const FRASES = [

  ];
  // One phrase per calendar day (local time), cycling through the list.
  const fraseDelDia = () => { const d = new Date(); return FRASES[Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) % FRASES.length]; };

  // ---------- Header / tabs ----------
  function renderChrome() {

  // ---------- Prendas ----------
  const filtroVacio = (armario = "") => ({ q: "", tipo: "", color: "", estilo: "", armario });
  const FACETAS = { tipo: (p) => (p.tipo ? [p.tipo] : []), color: (p) => p.colores || [], estilo: (p) => p.estilo || [] };
  function filterPrendas(list, f) {
    const q = (f.q || "").trim().toLowerCase();
    return list.filter((p) =>
      (!f.tipo || p.tipo === f.tipo) &&
      (!f.color || (p.colores || []).includes(f.color)) &&
      (!f.estilo || (p.estilo || []).includes(f.estilo)) &&
      (!f.armario || p.armario === f.armario) &&
      (!q || [p.nombre, p.marca, p.talle, p.tipo, ...(p.colores || []), ...(p.estilo || []), armarioNombre(p.armario)].join(" ").toLowerCase().includes(q)));
  }
  // Options for one facet: only values present in the garments that match every *other* active filter
  // (so picking a closet hides the types, colors and styles it doesn't have), in list order, with counts.
  function opcionesFaceta(f, k) {
    const base = filterPrendas(state.prendas, { ...f, [k]: "" });
    const cuenta = new Map();
    for (const p of base) for (const v of FACETAS[k](p)) cuenta.set(v, (cuenta.get(v) || 0) + 1);
    const lista = ordenados({ tipo: "tipos", color: "colores", estilo: "estilos" }[k]).map((x) => x.nombre);
    const vals = [...lista.filter((v) => cuenta.has(v)), ...[...cuenta.keys()].filter((v) => !lista.includes(v))];
    if (f[k] && !vals.includes(f[k])) vals.unshift(f[k]);
    return vals.map((v) => [v, cuenta.get(v) || 0]);
  }
  // After the closet (or search) changes, drop facet picks that no longer match anything.
  function podarFiltro(f) { for (const k of Object.keys(FACETAS)) if (f[k] && !opcionesFaceta(f, k).some(([v, n]) => v === f[k] && n > 0)) f[k] = ""; }
  // Filters, phone-first: one row of compact pills (house, type, color, style). Tapping a pill opens its
  // options below as a wrapped set of chips, so nothing is hidden in a sideways scroll.
  const FACETA_TITULO = { tipo: "Tipo", color: "Color", estilo: "Estilo" };
  function facetasHtml(f, scope) {
    const abierta = ui.faceta[scope];
    const render = (k, v) => (k === "color" ? dot(v) : "") + esc(v);
    const pills = Object.keys(FACETA_TITULO).map((k) => {
      const ops = opcionesFaceta(f, k);
      if (!ops.length) return "";
      return `<button type="button" class="fpill ${f[k] ? "activo" : ""}" data-faceta-abrir="${scope}:${k}" aria-expanded="${abierta === k}">
        ${f[k] ? render(k, f[k]) : FACETA_TITULO[k]}<span class="fpill-flecha" aria-hidden="true">▾</span></button>`;
    }).join("");
    // The house works like the other pills: tap to open its options below.
    const casa = state.armarios.length ? `<button type="button" class="fpill ${f.armario ? "activo" : ""}" data-faceta-abrir="${scope}:armario" aria-expanded="${abierta === "armario"}">
        ${f.armario ? esc(armarioNombre(f.armario)) : "Casa"}<span class="fpill-flecha" aria-hidden="true">▾</span></button>` : "";
    let opciones = "";
    if (abierta === "armario") {
      const base = filterPrendas(state.prendas, { ...f, armario: "" });
      const cuenta = (id) => base.filter((p) => p.armario === id).length;
      opciones = `<div class="faceta-opciones"><span class="label">Casa</span><div class="chips">
        <button type="button" class="chip" data-f="${scope}" data-k="armario" data-v="" aria-pressed="${!f.armario}">Todas<span class="n">${base.length}</span></button>
        ${[...state.armarios].sort(byDate).map((a) => `<button type="button" class="chip" data-f="${scope}" data-k="armario" data-v="${esc(a.id)}" aria-pressed="${f.armario === a.id}">${esc(a.nombre)}<span class="n">${cuenta(a.id)}</span></button>`).join("")}</div></div>`;
    } else if (abierta && FACETA_TITULO[abierta]) {
      const ops = opcionesFaceta(f, abierta);
      opciones = `<div class="faceta-opciones"><span class="label">${FACETA_TITULO[abierta]}</span><div class="chips">
        <button type="button" class="chip" data-f="${scope}" data-k="${abierta}" data-v="" aria-pressed="${!f[abierta]}">Todos</button>
        ${ops.map(([v, n]) => `<button type="button" class="chip" data-f="${scope}" data-k="${abierta}" data-v="${esc(v)}" aria-pressed="${f[abierta] === v}">${render(abierta, v)}<span class="n">${n}</span></button>`).join("")}</div></div>`;
    }
    return `<div class="fpills">${casa}${pills}</div>${opciones}`;
  }
  function filtersHtml(f, scope) {
    return `<div class="filters">
      <label class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>

  // While she types in a search box, rebuild only the chips and the results, never the box itself:
  // replacing a focused field would close the iPhone keyboard.
  let busquedaTimer;

    clearTimeout(busquedaTimer);

      const f = scope === "pf" ? ui.f : ui.builder && ui.builder.f;

  }
  function tagHtml(p, opts = {}) {

      ${m ? `<p class="status" style="margin:-4px 0 14px">Tocá las prendas que te llevás y abajo elegí a qué casa.</p>` : ""}

          <strong>${m.sel.length ? (m.sel.length === 1 ? "1 prenda elegida" : `${m.sel.length} prendas elegidas`) + " · Llevar a:" : "Elegí prendas para mover"}</strong>
          <div class="chips">${[...state.armarios].sort(byDate).map((a) => `<button type="button" class="chip" data-mover-a="${esc(a.id)}" ${m.sel.length ? "" : "disabled"}>${esc(a.nombre)}</button>`).join("")}</div>
        </div></div>` : ""}`;

  function resPrendas() {
    const list = filterPrendas([...state.prendas].sort(byDate).reverse(), ui.f);
    const any = state.prendas.length > 0;
    const activo = ui.f.q || ui.f.tipo || ui.f.color || ui.f.estilo || ui.f.armario;

      ${!any ? `<div class="empty"><h3>Todavía no hay prendas</h3><p>Cargá tu primera prenda con una foto, el talle, la marca y el color. ${state.armarios.length ? "" : "Antes conviene crear un armario."}</p>
          ${canWrite ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${state.armarios.length ? "" : `<button class="btn" data-goto="armarios">Crear armario</button>`}<button class="btn primary" data-act="nueva-prenda">Cargar prenda</button></div>` : ""}</div>`
        : list.length ? `<div class="grid">${list.map((p) => (m ? tagHtml(p, { select: true, selected: m.sel.includes(p.id), pickAttr: "mpick" }) : tagHtml(p))).join("")}</div>`

          ? `<div class="empty"><h3>Todavía no hay nada en ${esc(armarioNombre(ui.f.armario))}</h3><p>Cargá lo que tenés acá, o traé prendas de otra casa con “Mover de casa”.</p>
              ${canWrite ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="todas-casas">Ver todas las casas</button><button class="btn primary" data-act="nueva-prenda">Cargar prenda</button></div>` : ""}</div>`
          : `<div class="empty"><h3>Nada con esos filtros</h3><p>Probá con otro color, tipo o armario.</p><button class="btn" data-act="limpiar">Limpiar filtros</button></div>`}`;
  }

  // ---------- Listas (types, colors, styles) ----------
  const CAT_CORTA = { arriba: "arriba", capa: "capa", abrigo: "abrigo", abajo: "abajo", entero: "vestido", calzado: "calzado", accesorio: "accesorio" };
  function listasHtml() {
    const grupo = (col, kind, titulo, ayuda, label) => {

          : `<p class="confirm">¿Borrar “${esc(conf.nombre)}”?${usan === 1 ? " Se lo saco a la prenda que lo usa." : usan ? ` Se lo saco a las ${usan} prendas que lo usan.` : ""} <button type="button" class="btn sm danger" data-lborrar-si="${col}:${esc(conf.id)}">Borrar</button><button type="button" class="btn sm" data-lborrar-no>No</button></p>`;

      return `<div class="lista">

        <div class="chips">${ordenados(col).map((x) => `<span class="chip lchip">${label(x)}${canWrite ? `<button type="button" class="chip-x" data-lborrar="${col}:${esc(x.id)}" aria-label="Borrar ${esc(x.nombre)}">×</button>` : ""}</span>`).join("")}
          ${canWrite ? `<button type="button" class="chip add" data-lnuevo="${kind}" aria-pressed="${ui.listas.nuevo === kind}">＋ Nuevo</button>` : ""}</div>
        ${confirm}${ui.listas.nuevo === kind ? nuevoForm(kind, "l") : ""}
      </div>`;
    };
    return `<section class="panel listas" style="margin-top:28px">
      <h3 style="font-size:20px">Tipos, colores y estilos</h3>
      <p class="status" style="margin:0">Son las opciones que aparecen al cargar una prenda y en los filtros. También podés crearlas desde la prenda con “＋ Nuevo”.</p>

  // ---------- Generator ----------
  const OCASIONES = ["Cena en un restaurante elegante", "Oficina", "Fin de semana tranquilo", "Fiesta", "Casamiento de día", "Entrenar"];
  const CLIMAS = [["Frío", 2, 10], ["Fresco", 10, 16], ["Templado", 16, 23], ["Calor", 24, 34]];

  // ---------- Weather per house (Open-Meteo: free, no account; only the house's rounded coordinates are sent) ----------
  const MOMENTOS = [["dia", "Todo el día", 7, 24], ["manana", "A la mañana", 7, 12], ["tarde", "A la tarde", 12, 19], ["noche", "A la noche", 19, 24]];
  const climaCache = (() => { try { return JSON.parse(localStorage.getItem("demr-clima") || "{}"); } catch (_) { return {}; } })();
  const guardarClimaCache = () => { try { localStorage.setItem("demr-clima", JSON.stringify(climaCache)); } catch (_) {} };
  function climaTexto(code) {
    if (code == null) return ["", ""];
    if (code === 0) return ["Despejado", "☀️"];
    if (code <= 2) return ["Algo nublado", "🌤️"];
    if (code === 3) return ["Nublado", "☁️"];
    if (code === 45 || code === 48) return ["Niebla", "🌫️"];
    if (code >= 51 && code <= 57) return ["Llovizna", "🌦️"];
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ["Lluvia", "🌧️"];
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ["Nieve", "❄️"];
    if (code >= 95) return ["Tormenta", "⛈️"];
    return ["", "🌡️"];
  }
  // The house whose weather counts: the one she's in, or the only one ticked in "Sacar ropa de".
  function casaClima() {
    const g = ui.gen;
    const id = ui.aca || (g.armarios && g.armarios.length === 1 ? g.armarios[0] : "");
    return state.armarios.find((a) => a.id === id) || null;
  }
  async function cargarClima(a, forzar) {
    const u = a.ubic; if (!u) return;
    const c = climaCache[a.id];
    if (!forzar && c && c.lat === u.lat && c.lon === u.lon && Date.now() - c.t < 3600e3) { aplicarClima(); return render(); }
    ui.clima.cargando = true; ui.clima.error = ""; render();
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${u.lat}&longitude=${u.lon}&hourly=temperature_2m,precipitation_probability,weather_code&current=temperature_2m,weather_code&timezone=auto&forecast_days=2`);
      if (!r.ok) throw new Error(String(r.status));
      const j = await r.json();
      if (!j.hourly || !Array.isArray(j.hourly.time) || !Array.isArray(j.hourly.temperature_2m)) throw new Error("formato");
      climaCache[a.id] = { t: Date.now(), lat: u.lat, lon: u.lon, hourly: j.hourly, current: j.current || null };
      guardarClimaCache();
    } catch (_) {
      ui.clima.error = climaCache[a.id] ? "Sin conexión: te muestro el último pronóstico que traje." : "No pude traer el pronóstico. Poné la temperatura a mano.";
    }
    ui.clima.cargando = false;
    aplicarClima(); render();
  }
  // Min/max temperature, rain chance and sky for one day (0 = today, 1 = tomorrow) and part of the day.
  function resumenClima(c, dia, momento) {
    const h = c.hourly;
    const dias = [...new Set(h.time.map((t) => t.slice(0, 10)))];
    const fecha = dias[dia]; if (!fecha) return null;
    const [, , desde, hasta] = MOMENTOS.find((m) => m[0] === momento) || MOMENTOS[0];
    let idx = h.time.map((t, i) => [t, i]).filter(([t]) => t.startsWith(fecha) && +t.slice(11, 13) >= desde && +t.slice(11, 13) < hasta).map(([, i]) => i);
    // "Todo el día" for today means what's left of it.
    const ahora = c.current && c.current.time;
    if (dia === 0 && momento === "dia" && ahora) { const resto = idx.filter((i) => h.time[i] >= ahora.slice(0, 13)); if (resto.length) idx = resto; }
    const temps = idx.map((i) => h.temperature_2m[i]).filter((x) => typeof x === "number");
    if (!temps.length) return null;
    const probs = idx.map((i) => (h.precipitation_probability || [])[i]).filter((x) => typeof x === "number");
    const codes = idx.map((i) => (h.weather_code || [])[i]).filter((x) => typeof x === "number");
    const lluvia = probs.length ? Math.max(...probs) : 0;
    const frec = new Map(); codes.forEach((k) => frec.set(k, (frec.get(k) || 0) + 1));
    let code = [...frec.entries()].sort((x, y) => y[1] - x[1] || y[0] - x[0])[0]?.[0];
    if (lluvia >= 50) { const llueve = codes.filter((k) => k >= 51); if (llueve.length) code = Math.max(...llueve); }
    return { min: Math.round(Math.min(...temps)), max: Math.round(Math.max(...temps)), lluvia, code };
  }
  // Fill the temperature from the forecast, unless she typed her own.
  function aplicarClima() {
    const g = ui.gen, cl = ui.clima;
    if (!cl.momentoElegido) cl.momento = /cena|noche|fiesta|boliche|teatro|\bbar\b/i.test(g.ocasion || "") ? "noche" : /almuerzo|mediod/i.test(g.ocasion || "") ? "tarde" : "dia";
    const a = casaClima(); const c = a && a.ubic && climaCache[a.id];
    const r = c && resumenClima(c, cl.dia, cl.momento);
    g.lluvia = r ? r.lluvia : 0;
    if (r && !cl.manual) { g.tmin = r.min; g.tmax = r.max; }
  }
  function climaHtml() {

    }
    if (!cl.pedido.has(a.id)) { cl.pedido.add(a.id); setTimeout(() => cargarClima(a)); }
    const c = climaCache[a.id];
    const r = c && c.lat === a.ubic.lat && c.lon === a.ubic.lon ? resumenClima(c, cl.dia, cl.momento) : null;
    const [txt, ico] = r ? climaTexto(r.code) : ["", ""];
    return `<div class="clima">
      <div class="clima-head"><span class="label">Clima en ${esc(a.nombre)}</span>
        <span class="clima-ubic">${esc(a.ubic.nombre)}${canWrite ? ` · <button type="button" class="linkish" data-ubic-abrir="${esc(a.id)}">Cambiar</button>` : ""}</span></div>

      <div class="chips">${MOMENTOS.map(([k, n]) => `<button type="button" class="chip" data-clima-momento="${k}" aria-pressed="${cl.momento === k}">${n}</button>`).join("")}</div>
      ${cl.cargando && !r ? `<p class="status" style="margin:0">Buscando el pronóstico…</p>` : ""}
      ${r ? `<p class="clima-res"><span class="clima-ico" aria-hidden="true">${ico}</span><span><strong>${r.min === r.max ? r.min : `${r.min} a ${r.max}`} °C</strong>${txt ? ` · ${txt}` : ""}${r.lluvia >= 20 ? ` · ${r.lluvia}% de lluvia` : ""}</span></p>` : ""}
      ${cl.error ? `<p class="status err" style="margin:0">${esc(cl.error)}</p>` : ""}
      ${r && cl.manual ? `<p class="status" style="margin:0">Estás usando tu propia temperatura. <button type="button" class="linkish" data-clima-volver>Volver al pronóstico</button></p>` : ""}

    </div>`;
  }
  // Where a house is: search by name (city or neighborhood) or use the phone's location.
  function ubicForm(a) {
    const u = ui.ubic && ui.ubic.armario === a.id ? ui.ubic : null;
    const q = u ? u.q : a.ubic ? "" : a.nombre;
    return `<div class="ubic">
      <div class="ubic-row"><input type="search" id="ubic-q-${esc(a.id)}" data-ubic-q="${esc(a.id)}" value="${esc(q)}" placeholder="Ciudad o barrio, ej.: Olivos" enterkeyhint="search" aria-label="Dónde queda ${esc(a.nombre)}">

  function generarLocal(pool, ocasion, lo, hi) {

    const propio = ordenados("estilos").find((e) => !ESTILOS_INICIALES.includes(e.nombre) && s.includes(e.nombre.toLowerCase()));
    const objetivo = propio ? propio.nombre : /elegan|cena|restaur|casamiento|evento|formal|gala|teatro/.test(s) ? "Elegante"
      : /fiesta|boliche|cumple|noche/.test(s) ? "Fiesta" : /oficina|trabajo|reuni/.test(s) ? "Oficina"
      : /deport|gym|correr|entren|caminar/.test(s) ? "Deportivo" : "Casual";
    const necesitoAbrigo = t < 12 ? 3 : t < 19 ? 2 : 0;
    const score = (p) => ((p.estilo || []).includes(objetivo) ? 4 : 0) + ((p.estilo || []).includes("Casual") && objetivo === "Casual" ? 1 : 0)

      return all.length ? all.filter((p) => score(p) >= score(all[0]) - 1) : all;

    const pick = (arr, i) => (arr.length ? arr[i % arr.length] : null);
    const nombres = { Elegante: ["Noche impecable", "Elegancia sin esfuerzo", "Clásico que no falla"], Fiesta: ["Listo para la pista", "Brillo justo", "Noche larga"], Oficina: ["Reunión de los lunes", "Prolijo y cómodo", "Modo oficina"], Deportivo: ["A moverse", "Entrenamiento", "Cómodo total"], Casual: ["Domingo tranquilo", "Sale con todo", "Básico que suma"] }[objetivo] || [`Look ${objetivo.toLowerCase()}`, `${objetivo} con onda`, `${objetivo} sin vueltas`];

      else { items.push(pick(arriba, i)); items.push(pick(abajo, Math.floor(i / 2) + (i % 2))); }
      if (necesitoAbrigo >= 2 && capa.length) items.push(pick(capa, i));
      if (necesitoAbrigo >= 2 && abrigo.length) items.push(pick(abrigo, i % Math.min(2, abrigo.length)));
      if (calzado.length) items.push(pick(calzado, i));
      if (acc.length && i % 2 === 0) items.push(pick(acc, i));
      const ids = [...new Set(items.filter(Boolean).map((p) => p.id))];
      const key = [...ids].sort().join();
      if (ids.length >= 2 && !vistos.has(key)) {
        vistos.add(key);
        res.push({ nombre: nombres[res.length], prendas: ids, nota: `Prioricé prendas de estilo ${objetivo.toLowerCase()}${necesitoAbrigo >= 2 ? " y sumé abrigo por el frío" : t > 24 ? " y livianas por el calor" : ""}.` });
      }
    }

  }

        <p class="tuto-nota">Si le cargás la ubicación a cada casa (en Armarios), completo la temperatura con el pronóstico de ahí.</p>` };
      case "copia": return { titulo: "Que no se pierda nada", html: `<p>Todo queda guardado en este teléfono, fotos incluidas.</p>
        <p>De vez en cuando tocá <strong>Guardar copia</strong> (en Armarios) y elegí “Guardar en Archivos” → iCloud Drive. Te aviso cuando haga falta.</p>
        <p class="tuto-nota">Si borrás la app del inicio se borra todo, así que antes guardá una copia.</p>` };
      default: {
        const ej = state.prendas.filter((p) => p.ejemplo).length + state.outfits.filter((o) => o.ejemplo).length;
        return { titulo: "¡Listo!", ejemplos: ej, html: ej
          ? `<p>Dejé algunas prendas y un outfit de <strong>ejemplo</strong> para que pruebes cómo funciona.</p><p>¿Los borro para que empieces con tu ropa?</p>`
          : `<p>Ya podés empezar a cargar tu ropa. ¡Que lo disfrutes!</p>` };
      }
    }
  }
  function renderTuto() {
    const t = ui.tuto; const paso = t.pasos[t.i]; const c = contenidoTuto(paso);
    const ultimo = t.i === t.pasos.length - 1;
    dlgTuto.innerHTML = `<div class="tuto-arte" style="background:${COLOR_PASO[t.i % COLOR_PASO.length]}">
        <span class="tuto-sticker"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[paso]}</svg></span>
        ${ultimo ? "" : `<button type="button" class="btn sm tuto-saltar" data-tuto="saltar">Saltar</button>`}
      </div>
      <div class="tuto-cuerpo">
        <span class="tuto-n">${t.i + 1} de ${t.pasos.length}</span>
        <h2 id="tuto-titulo">${esc(c.titulo)}</h2>
        ${c.html}
      </div>
      <div class="tuto-pie">
        <div class="tuto-dots" aria-hidden="true">${t.pasos.map((_, k) => `<span class="${k === t.i ? "on" : ""}"></span>`).join("")}</div>
        <div class="tuto-botones">
          ${t.i > 0 ? `<button type="button" class="btn ghost" data-tuto="atras">Atrás</button>` : ""}
          ${!ultimo ? `<button type="button" class="btn primary" data-tuto="siguiente">${paso === "instalar" ? "Seguir acá igual" : "Siguiente"}</button>`
            : c.ejemplos ? `<button type="button" class="btn" data-tuto="fin">Dejarlos</button><button type="button" class="btn primary" data-tuto="fin-borrar">Borrar y empezar</button>`
            : `<button type="button" class="btn primary" data-tuto="fin">Empezar</button>`}
        </div>
      </div>`;
  }
  function abrirTuto() {
    ui.tuto = { i: 0, pasos: pasosTuto() };
    renderTuto();
    if (!dlgTuto.open) dlgTuto.showModal();
  }
  async function cerrarTuto(conBorrar) {
    tutoVisto.set(); ui.tuto = null;
    if (dlgTuto.open) dlgTuto.close();
    if (conBorrar) await borrarEjemplos();
    render();
  }
  function accionTuto(a) {
    const t = ui.tuto; if (!t) return;
    if (a === "siguiente" && t.i < t.pasos.length - 1) { t.i++; return renderTuto(); }
    if (a === "atras" && t.i > 0) { t.i--; return renderTuto(); }
    if (a === "saltar" || a === "fin") return cerrarTuto(false);
    if (a === "fin-borrar") return cerrarTuto(true);
  }
  dlgTuto.addEventListener("cancel", (e) => { e.preventDefault(); cerrarTuto(false); });
  // Swipe left/right between steps.
  let toque = null;
  dlgTuto.addEventListener("touchstart", (e) => { toque = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  dlgTuto.addEventListener("touchend", (e) => {
    if (!toque || !ui.tuto) return;
    const dx = e.changedTouches[0].clientX - toque.x, dy = e.changedTouches[0].clientY - toque.y; toque = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    accionTuto(dx < 0 ? "siguiente" : "atras");
  });

  // ---------- Boot ----------
  const h = (location.hash || "").slice(1);
  if (["prendas", "armarios", "outfits", "generar"].includes(h)) ui.view = h;
  render();

  async function boot() {
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [d, a, s, u] = await Promise.all([use("db"), use("assets"), use("sample"), use("user")]);
    assets = a; sample = s;
    if (u && u.can) { try { const w = await u.can("data.write"); if (w === false) canWrite = false; } catch (_) {} }
    if (!d) {
      try { await bootLocal(); state.mode = "local"; assets = localAssets; aplicarAca(acaGuardada.get()); }
      catch (_) { state.mode = "memoria"; Object.assign(state, listasIniciales()); }
      render();
      if (state.mode === "local" && !tutoVisto.get()) abrirTuto();
      return;
    }
    db = d;
    let pending = COLS.length + LISTAS.length;
    for (const col of [...COLS, ...LISTAS]) {
      db.collection(col).onSnapshot((snap) => {
        state[col] = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        if (!state.loaded[col]) { state.loaded[col] = true; pending--; }
        if (pending <= 0) {
          if (state.mode === "cargando") {
            aplicarAca(acaGuardada.get());
            state.mode = "db";
            // A shared store from before the lists existed: write the defaults once.
            if (canWrite && LISTAS.every((k) => !state[k].length)) {
              const ini = listasIniciales(state.prendas);
              for (const k of LISTAS) for (const v of ini[k]) { const { id, ...rest } = v; db.collection(k).doc(id).set(rest).catch(() => {}); }
            }
          }
          if (col === "armarios" && ui.gen.armarios) ui.gen.armarios = ui.gen.armarios.filter((id) => state.armarios.some((x) => x.id === id));
          render();
        }
      }, () => { toast("Se cortó la conexión con el vestidor. Recargá la página."); });
    }
  }
  boot();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
