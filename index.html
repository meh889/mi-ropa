<html lang="es-AR" data-skin="stickers">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>¿Dónde está mi ropa?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a closet rail. Sticky tab bar on top, garments shown as hang tags in a wrapping grid, dialogs for editing. */
:root {
  --bg: #f5f2f6;
  --surface: #ffffff;
  --sunk: #ece6ee;
  --ink: #2a1f2d;
  --muted: #65576b;
  --line: #ddd3e1;
  --accent: #b81f57;
  --accent-soft: #f7dce6;
  --accent-ink: #ffffff;
  --ok: #2f7a4a;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(42, 31, 45, .06), 0 6px 18px -10px rgba(42, 31, 45, .25);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17111a; --surface: #221a26; --sunk: #2b2230; --ink: #f2ebf4; --muted: #a797ad;
    --line: #3a2f40; --accent: #ff5d94; --accent-soft: #3f1d2c; --accent-ink: #1b0d13;
    --ok: #6fcf93; --warn: #f0b45a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17111a; --surface: #221a26; --sunk: #2b2230; --ink: #f2ebf4; --muted: #a797ad;
  --line: #3a2f40; --accent: #ff5d94; --accent-soft: #3f1d2c; --accent-ink: #1b0d13;
  --ok: #6fcf93; --warn: #f0b45a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; padding-block: 28px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 46px; height: 46px; flex: none; color: var(--accent); }
.brand h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.summary { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

/* Tabs */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 420px) { .tabs-inner { gap: 0; } .tab { padding: 8px 10px; font-size: 14px; } .tab .n { margin-left: 3px; } }
.tab .n { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; margin-left: 6px; opacity: .7; }

/* Generic controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 32px; padding: 5px 12px; font-size: 13.5px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; min-height: 42px; font-size: 16px;
}
textarea { resize: vertical; min-height: 70px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(127,127,127,.45); flex: none; display: inline-block; }
.dot.estampado { background: conic-gradient(#e45b8a, #f2c94c, #4fb08a, #5a7fe0, #e45b8a); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toolbar h2 { font-size: 26px; font-weight: 700; }
.toolbar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; justify-content: space-between; border: 1px dashed var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
.banner strong { color: var(--ink); }

/* Filters */
.filters { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 18px; }
.filters .row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 560px) {
  .filters { padding: 12px; gap: 10px; }
  .filters .row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
  .filters .row .field > span { display: none; }
  .filters .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -12px; padding-inline: 12px; }
  .filters .chip { flex: none; }
}
.filters .group { display: grid; gap: 6px; min-width: 0; }
.filter-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Hang tag cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 18px 14px; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.tag {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px var(--r) var(--r);
  box-shadow: var(--shadow); text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  transition: transform .18s ease, box-shadow .18s ease;
}
.tag:hover { transform: translateY(-2px) rotate(-.4deg); }
.tag::before { /* the punched hole of a hang tag */
  content: ""; position: absolute; top: 9px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line); z-index: 2;
}
.tag .pic { aspect-ratio: 4 / 5; max-width: 100%; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.tag .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag .pic svg { width: 54%; height: auto; }
.tag .body { padding: 10px 12px 12px; display: grid; gap: 5px; min-width: 0; }
.tag .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.tag .meta { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.tag .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
.tag .dots { display: flex; gap: 3px; flex: none; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill.ex { background: transparent; border: 1px dashed var(--line); }
.tag.selectable[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.tag.selectable[aria-pressed="true"] .check { display: grid; }
.check { display: none; position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); place-items: center; z-index: 3; font-weight: 700; }
.tag.mini .body { padding: 8px 10px 10px; }
.tag.mini .name { font-size: 13.5px; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { color: var(--ink); font-size: 20px; }
.empty p { margin: 0; max-width: 46ch; }

/* Armarios */
.closets { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.closet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.closet .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.closet h3 { font-size: 22px; overflow-wrap: anywhere; }
.closet .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.rail { display: flex; gap: 6px; height: 64px; align-items: flex-end; border-top: 3px solid var(--ink); padding-top: 4px; overflow: hidden; }
.rail .hang { width: 22px; flex: none; border-radius: 3px 3px 6px 6px; border: 1px solid rgba(127,127,127,.35); }
.rail .none { font-size: 13px; color: var(--muted); align-self: center; }
.closet .row { display: flex; flex-wrap: wrap; gap: 6px; }
.closet.new { border-style: dashed; background: transparent; align-content: start; }

/* Outfits */
.outfits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.outfit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
.collage { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 2px; background: var(--line); aspect-ratio: 4 / 3; max-width: 100%; }
.collage > div { background: var(--sunk); display: grid; place-items: center; overflow: hidden; min-height: 0; }
.collage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.collage svg { width: 46%; max-height: 80%; }
.outfit .body { padding: 12px 14px 14px; display: grid; gap: 8px; }
.outfit h3 { font-size: 19px; overflow-wrap: anywhere; }
.outfit .occ { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.outfit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.outfit li { display: flex; gap: 8px; align-items: center; min-width: 0; }
.outfit li span:last-child { overflow-wrap: anywhere; }
.outfit .note { font-size: 14px; color: var(--muted); margin: 0; }
.outfit .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding: 0 14px 14px; }

/* Builder */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 820px) { .builder { grid-template-columns: 1fr; } }
.tray { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
@media (max-width: 820px) { .tray { position: static; order: -1; } }
.tray ol { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 2px; }
.tray .hint { font-size: 13.5px; color: var(--muted); margin: 0; }

/* Generator */
.gen { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .gen { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 16px; }
.temp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.temp input { text-align: center; font-family: var(--f-mono); }
.thermo { height: 8px; border-radius: 999px; background: linear-gradient(90deg, #5a8fe0, #8ec5ea 35%, #f2c94c 65%, #ef7d32); position: relative; }
.thermo .sel { position: absolute; top: -3px; bottom: -3px; border: 2px solid var(--ink); border-radius: 999px; }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks .c { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.results { display: grid; gap: 14px; }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--accent); }
.engine { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }

/* Dialog */
dialog { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(23, 17, 26, .5); }
dialog form { display: grid; gap: 16px; padding: 20px; }
dialog h2 { font-size: 24px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
.photo-pick { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.photo-pick .pv { aspect-ratio: 4 / 5; max-width: 100%; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.photo-pick .pv img { width: 100%; height: 100%; object-fit: cover; }
.photo-pick .pv svg { width: 60%; }
.photo-pick .ctrl { display: grid; gap: 8px; justify-items: start; font-size: 13.5px; color: var(--muted); }
.care { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.dlg-foot .r { display: flex; gap: 8px; margin-left: auto; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { .tag { transition: none; } .tag:hover { transform: none; } }

/* ================= Stickers look (light only), applied through data-skin="stickers" on <html>. ================= */
.slush-only { display: none; }

/* --- Skin "stickers": pastel paper, crushed poster type, 1px black outlines, a shared sticker palette --- */
:root[data-skin="stickers"] {
  --bg: #dceeff; --surface: #ffffff; --sunk: #e9e9e9; --ink: #000000; --muted: #3a3a3a; --line: #000000;
  --accent: #000000; --accent-soft: #e9ccff; --accent-ink: #ffffff; --ok: #000000; --warn: #fb4903; --shadow: none; --r: 20px;
  --st-blue: #4da2ff; --st-mint: #55db9c; --st-lav: #e9ccff; --st-ember: #fb4903; --st-sun: #ffd731; --st-violet: #5c4ade;
  --f-display: "Bowlby One", "Arial Black", Impact, system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[data-skin="stickers"] body { font-weight: 500; letter-spacing: -0.01em; font-feature-settings: "tnum"; }
[data-skin="stickers"] .slush-only { display: block; }
[data-skin="stickers"] .marquee {
  overflow: hidden; background: #000; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: .032em; text-transform: uppercase;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-block: 7px; white-space: nowrap;
}
[data-skin="stickers"] .marquee-track { display: inline-flex; animation: marquee 28s linear infinite; }
[data-skin="stickers"] .marquee-track span { padding-right: 2em; }
@keyframes marquee { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { [data-skin="stickers"] .marquee-track { animation: none; } }
[data-skin="stickers"] header.top { position: relative; padding-block: 22px 18px; }
[data-skin="stickers"] .brand { align-items: flex-end; }
[data-skin="stickers"] .brand svg { width: 64px; height: 64px; padding: 10px; background: var(--st-sun); border: 1px solid #000; border-radius: 50%; color: #000; transform: rotate(-12deg); stroke-width: 2.4; }
/* Line-height is a bit looser than .8 here so the accents in DÓNDE and ESTÁ don't run into the line above. */
[data-skin="stickers"] .brand h1 { font-weight: 400; text-transform: uppercase; font-size: clamp(38px, 10.5vw, 88px); line-height: .9; letter-spacing: 0; }
@media (max-width: 420px) {
  [data-skin="stickers"] .tab { padding: 7px 11px; font-size: 11.5px; }
  [data-skin="stickers"] .tab .n { display: none; } /* the counts already sit in the pill above */
}
[data-skin="stickers"] .brand h1 span { color: #000; display: inline-block; background: var(--st-lav); border: 1px solid #000; border-radius: 16px; padding: .08em .12em 0; transform: rotate(-2deg); }
[data-skin="stickers"] .summary { color: #000; font-weight: 700; font-size: 12px; letter-spacing: .032em; text-transform: uppercase; background: #fff; border: 1px solid #000; border-radius: 999px; padding: 6px 12px; }
[data-skin="stickers"] .sticker-star { position: absolute; right: 0; top: 14px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--st-ember); border: 1px solid #000; border-radius: 14px; transform: rotate(14deg); font-size: 22px; color: #000; }
[data-skin="stickers"] nav.tabs { border-bottom: 0; }
[data-skin="stickers"] .tabs-inner { gap: 4px; }
[data-skin="stickers"] .tab { border: 1px solid #000; background: #fff; color: #000; border-radius: 999px; font-weight: 700; font-size: 12.5px; letter-spacing: .032em; text-transform: uppercase; }
[data-skin="stickers"] .tab:hover { background: var(--st-lav); color: #000; }
[data-skin="stickers"] .tab[aria-selected="true"] { background: #000; color: #fff; }
[data-skin="stickers"] .toolbar h2 { font-weight: 400; text-transform: uppercase; font-size: clamp(40px, 12vw, 72px); line-height: .8; }
[data-skin="stickers"] .btn { border: 1px solid #000; border-radius: 999px; background: #fff; color: #000; font-weight: 700; font-size: 13px; letter-spacing: .032em; text-transform: uppercase; }
[data-skin="stickers"] .btn.primary { background: #000; color: #fff; }
[data-skin="stickers"] .btn.ghost { background: #fff; border-color: #000; }
[data-skin="stickers"] .btn.danger { background: var(--st-ember); color: #000; }
[data-skin="stickers"] .btn.sm { font-size: 11.5px; }
[data-skin="stickers"] .chip { border: 1px solid #000; border-radius: 999px; background: #fff; font-weight: 600; }
[data-skin="stickers"] .chip[aria-pressed="true"] { background: var(--st-lav); border-color: #000; font-weight: 700; }

<script>
(() => {
  // ---------- Vocabulary ----------
  const TIPOS = [
    ["Remera", "arriba"], ["Camisa", "arriba"], ["Top", "arriba"],
    ["Suéter", "capa"], ["Buzo", "capa"], ["Saco", "capa"],
    ["Campera", "abrigo"], ["Tapado", "abrigo"],
    ["Pantalón", "abajo"], ["Jean", "abajo"], ["Pollera", "abajo"], ["Short", "abajo"],
    ["Vestido", "entero"], ["Enterito", "entero"],
    ["Calzado", "calzado"], ["Accesorio", "accesorio"],
  ];
  const CAT = Object.fromEntries(TIPOS);
  const COLORES = [
    ["Negro", "#1f1c22"], ["Blanco", "#f7f7f5"], ["Gris", "#9a9aa2"], ["Beige", "#d9c4a3"], ["Marrón", "#7a4a2c"],
    ["Azul", "#2c4a9a"], ["Celeste", "#8cc3ea"], ["Denim", "#4b6b92"], ["Verde", "#3d7b4f"], ["Oliva", "#717a3b"],
    ["Rojo", "#c42b2b"], ["Bordó", "#6b1a2d"], ["Rosa", "#f0a6c1"], ["Violeta", "#7c58c0"], ["Amarillo", "#f1c84b"],
    ["Naranja", "#eb7a30"], ["Estampado", "url(#g-estampado)"],
  ];
  const HEX = Object.fromEntries(COLORES);
  const ESTILOS = ["Casual", "Elegante", "Oficina", "Deportivo", "Fiesta"];
  const ABRIGO = [[1, "Liviano"], [2, "Medio"], [3, "Abrigado"]];

  const SHAPES = {
    arriba: "M16 7 8 11 4 19l6 3 2-3v23h24V19l2 3 6-3-4-8-8-4c-2 3-5 4-8 4s-6-1-8-4Z",
    capa: "M16 6 8 9 4 38l6 1 2-20v23h24V19l2 20 6-1-4-29-8-3c-2 3-5 4-8 4s-6-1-8-4Z",
    abrigo: "M17 4 9 8 5 40l6 1 2-20v25h22V21l2 20 6-1-4-32-8-4-7 12Z",
    abajo: "M14 4h20l3 40h-9l-4-28-4 28h-9Z",
    Pollera: "M16 8h16l8 32H8Z",
    Short: "M14 8h20l2 22H26l-2-12-2 12H12Z",
    entero: "M18 4h12l-1 8 4 6 7 26H8l7-26 4-6Z",
    calzado: "M6 31V20h10c3 4 7 6 12 6l12 2c3 1 4 3 4 6v2H6Z",
    accesorio: "M10 18h28l3 24H7Z",
  };
  function shapeFor(tipo) { return SHAPES[tipo] || SHAPES[CAT[tipo]] || SHAPES.arriba; }
  function silhouette(p) {
    const fill = HEX[(p.colores || [])[0]] || "#c9bfcc";
    const extra = tipoCat(p.tipo) === "accesorio" ? '<path d="M17 18q0-10 7-10t7 10" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="2"/>' : "";
    return `<svg viewBox="0 0 48 48" aria-hidden="true">${extra}<path d="${shapeFor(p.tipo)}" fill="${fill}" stroke="currentColor" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  }
  const tipoCat = (t) => CAT[t] || "arriba";

  // ---------- Helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const VALID_ASSET = /^[0-9a-f]{32}$/;
  const fotoCache = new Map(); // on-device photo id -> object URL
  const fotoUrl = (id) => (!id ? "" : fotoCache.has(id) ? fotoCache.get(id) : VALID_ASSET.test(id) ? "/_blob/" + id : "");
  const rid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- On-device storage (IndexedDB), used when there is no shared database ----------
  const COLS = ["armarios", "prendas", "outfits"];
  const idb = {
    db: null,
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("donde-esta-mi-ropa", 1);
        r.onupgradeneeded = () => { for (const s of [...COLS, "fotos"]) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: "id" }); };
        r.onsuccess = () => res((idb.db = r.result));
        r.onerror = () => rej(r.error);
      });
    },
    run(store, mode, fn) {
      return new Promise((res, rej) => {
        const t = idb.db.transaction(store, mode); const s = t.objectStore(store); let out;
        const req = fn(s); if (req) req.onsuccess = () => (out = req.result);
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    },
    all: (s) => idb.run(s, "readonly", (st) => st.getAll()),
    put: (s, v) => idb.run(s, "readwrite", (st) => st.put(v)),
    del: (s, id) => idb.run(s, "readwrite", (st) => st.delete(id)),
    clear: (s) => idb.run(s, "readwrite", (st) => st.clear()),
  };
  // Photos are stored as raw bytes rather than Blob objects: WebKit has had releases where
  // Blobs kept in IndexedDB became unreadable after the app was closed.
  const fotoRow = async (id, blob) => ({ id, type: blob.type || "image/jpeg", data: await blob.arrayBuffer() });
  const rowBlob = (x) => (x.data ? new Blob([x.data], { type: x.type || "image/jpeg" }) : x.blob || null);
  const localAssets = {
    async upload(blob) {
      const id = rid("f");
      await idb.put("fotos", await fotoRow(id, blob));
      fotoCache.set(id, URL.createObjectURL(blob));
      return { id, url: fotoCache.get(id) };
    },
    async delete(id) {
      await idb.del("fotos", id);
      if (fotoCache.has(id)) { URL.revokeObjectURL(fotoCache.get(id)); fotoCache.delete(id); }
      return { deleted: true };
    },
  };
  // First run on a device: one closet per house plus a few marked examples.
  const CASAS = ["Ricardo", "Mati", "Borges", "VDL", "Mar del Plata"];
  const SEED = {
    armarios: CASAS.map((nombre, i) => ({ id: "a-" + nombre.toLowerCase().replace(/\s+/g, "-"), nombre, creado: 1 + i })),
    prendas: [
      ["ej-sueter", "Suéter de lana trenzado", "Suéter", "a-mati", "M", ["Beige"], ["Elegante", "Casual"], 3],
      ["ej-sastrero", "Pantalón sastrero", "Pantalón", "a-mati", "38", ["Negro"], ["Elegante", "Oficina"], 2],
      ["ej-remera", "Remera básica", "Remera", "a-mati", "M", ["Blanco"], ["Casual"], 1],
      ["ej-vestido", "Vestido midi", "Vestido", "a-mati", "S", ["Bordó"], ["Elegante", "Fiesta"], 1],
      ["ej-tapado", "Tapado largo", "Tapado", "a-mati", "M", ["Marrón"], ["Elegante"], 3],
      ["ej-botas", "Botas de cuero", "Calzado", "a-mati", "38", ["Negro"], ["Elegante", "Casual"], 2],
      ["ej-jean", "Jean recto", "Jean", "a-mati", "28", ["Celeste"], ["Casual"], 2],
      ["ej-camisa", "Camisa Oxford", "Camisa", "a-ricardo", "L", ["Celeste"], ["Oficina", "Elegante"], 1],
      ["ej-chino", "Chino", "Pantalón", "a-ricardo", "42", ["Beige"], ["Casual", "Oficina"], 2],
      ["ej-campera", "Campera de jean", "Campera", "a-ricardo", "L", ["Denim"], ["Casual"], 2],
      ["ej-saco", "Saco de vestir", "Saco", "a-ricardo", "50", ["Azul"], ["Elegante", "Oficina"], 2],
      ["ej-zapas", "Zapatillas blancas", "Calzado", "a-ricardo", "42", ["Blanco"], ["Casual", "Deportivo"], 1],
    ].map(([id, nombre, tipo, armario, talle, colores, estilo, abrigo], i) => ({ id, nombre, tipo, armario, talle, marca: "", colores, estilo, abrigo, foto: null, ejemplo: true, creado: 10 + i })),
    outfits: [{ id: "ej-outfit", nombre: "Cena con frío", prendas: ["ej-sueter", "ej-sastrero", "ej-tapado", "ej-botas"], ocasion: "Restaurante elegante · 6–12 °C", nota: "Ejemplo armado a mano.", origen: "manual", ejemplo: true, creado: 50 }],
  };
  async function bootLocal() {
    await idb.open();
    let firstRun = true;
    try { firstRun = !localStorage.getItem("demr-init"); } catch (_) {}
    const [a, p, o, f] = await Promise.all([...COLS.map(idb.all), idb.all("fotos")]);
    if (firstRun && !a.length && !p.length && !o.length) {
      for (const c of COLS) for (const v of SEED[c]) await idb.put(c, v);
      state.armarios = [...SEED.armarios]; state.prendas = [...SEED.prendas]; state.outfits = [...SEED.outfits];
    } else { state.armarios = a; state.prendas = p; state.outfits = o; }
    try { localStorage.setItem("demr-init", "1"); } catch (_) {}
    // Installs from before the five houses were known: add the missing ones once.
    let casasHechas = true;
    try { casasHechas = !!localStorage.getItem("demr-casas"); } catch (_) {}
    if (!casasHechas) {
      const tiene = new Set(state.armarios.map((x) => (x.nombre || "").trim().toLowerCase()));
      for (const s of SEED.armarios) if (!tiene.has(s.nombre.toLowerCase()) && !state.armarios.some((x) => x.id === s.id)) {
        const row = { ...s, creado: Date.now() + s.creado }; await idb.put("armarios", row); state.armarios.push(row);
      }
      try { localStorage.setItem("demr-casas", "1"); } catch (_) {}
    }
    for (const x of f) {
      const b = rowBlob(x); if (!b) continue;
      fotoCache.set(x.id, URL.createObjectURL(b));
      if (!x.data) { try { await idb.put("fotos", await fotoRow(x.id, b)); } catch (_) {} } // move older photos to the byte format
    }
    await pedirPersistencia();
  }
  // Asks the browser not to clear this app's storage when the phone runs low on space.
  async function pedirPersistencia() {
    try {
      if (!navigator.storage) return;
      state.persistido = (navigator.storage.persisted && (await navigator.storage.persisted())) || (navigator.storage.persist && (await navigator.storage.persist())) || false;
      if (navigator.storage.estimate) state.uso = (await navigator.storage.estimate()).usage || 0;
    } catch (_) {}
  }

  // Backup bookkeeping: when the last copy was made and how many changes happened since.
  const copia = {
    get() { try { return JSON.parse(localStorage.getItem("demr-copia") || "{}"); } catch (_) { return {}; } },
    set(v) { try { localStorage.setItem("demr-copia", JSON.stringify(v)); } catch (_) {} },
    cambio() { const c = copia.get(); c.cambios = (c.cambios || 0) + 1; copia.set(c); },
    hecha() { copia.set({ fecha: Date.now(), cambios: 0 }); },
  };
  function recordatorioCopia() {
    if (state.mode !== "local") return "";
    const c = copia.get();
    const reales = state.prendas.filter((p) => !p.ejemplo).length;
    if (!reales || !c.cambios) return "";
    const dias = c.fecha ? Math.floor((Date.now() - c.fecha) / 864e5) : null;
    if (c.fecha && c.cambios < 10 && dias < 7) return "";
    const cuando = c.fecha ? (dias === 0 ? "hoy" : dias === 1 ? "ayer" : `hace ${dias} días`) : null;
    return `<div class="banner"><span>${cuando ? `Tu última copia es de ${cuando}` : "Todavía no guardaste ninguna copia"} y hay <strong>${plural(c.cambios, "cambio", "cambios")}</strong> sin respaldar.</span><button class="btn sm primary" data-act="exportar">Guardar copia</button></div>`;
  }

  // ---------- Backup (on-device mode) ----------
  const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
  async function exportar() {
    const fotos = {};
    for (const x of await idb.all("fotos")) { const b = rowBlob(x); if (b) fotos[x.id] = await blobToDataUrl(b); }
    const data = { app: "donde-esta-mi-ropa", version: 1, fecha: new Date().toISOString(), armarios: state.armarios, prendas: state.prendas, outfits: state.outfits, fotos };
    const name = `vestidor-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify(data)], name, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Copia del vestidor" });
        copia.hecha(); render(); return toast("Copia guardada");
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    copia.hecha(); render(); toast("Copia descargada");
  }
  async function importar(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (_) { return toast("Ese archivo no es una copia del vestidor."); }
    if (!data || data.app !== "donde-esta-mi-ropa" || !COLS.every((c) => Array.isArray(data[c]))) return toast("Ese archivo no es una copia del vestidor.");
    // Decode everything first, so a bad file never leaves the phone half-erased.
    const fotos = [];
    for (const [id, url] of Object.entries(data.fotos || {})) {
      if (typeof url !== "string" || !url.startsWith("data:image/")) continue;
      try { fotos.push([id, await (await fetch(url)).blob()]); } catch (_) {}
    }
    const filas = Object.fromEntries(COLS.map((c) => [c, data[c].filter((r) => r && typeof r.id === "string")]));
    for (const c of [...COLS, "fotos"]) await idb.clear(c);
    for (const u of fotoCache.values()) URL.revokeObjectURL(u);
    fotoCache.clear();
    for (const [id, blob] of fotos) { await idb.put("fotos", await fotoRow(id, blob)); fotoCache.set(id, URL.createObjectURL(blob)); }
    for (const c of COLS) { for (const r of filas[c]) await idb.put(c, r); state[c] = filas[c]; }
    copia.hecha(); ui.backup = null; render(); toast("Copia restaurada");
  }
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  let toastTimer;

  }
  function pic(p) {

  }
  const byDate = (a, b) => (a.creado || 0) - (b.creado || 0);

  // ---------- State + store ----------
  const state = { armarios: [], prendas: [], outfits: [], mode: "cargando", loaded: { armarios: false, prendas: false, outfits: false } };
  const ui = {
    view: "prendas",

    builder: null, // { sel: [], nombre, ocasion, f: {...} }

    gen: { ocasion: "Cena en un restaurante elegante", tmin: 6, tmax: 12, armarios: null, estilo: "", busy: false, results: null, error: "", engine: "" },
  };
  let db = null, assets = null, sample = null;
  let canWrite = true;

  const store = {
    async add(col, data) {
      data = { ...data, creado: Date.now() };
      if (db) { const ref = db.collection(col).doc(); await ref.set(data); return ref.id; }
      const id = rid(col[0]);
      if (state.mode === "local") { await idb.put(col, { id, ...data }); copia.cambio(); if (!state.persistido) pedirPersistencia(); }
      state[col].push({ id, ...data }); render(); return id;
    },
    async update(col, id, data) {
      if (db) return db.collection(col).doc(id).update(data);
      const it = state[col].find((x) => x.id === id); if (!it) return;
      Object.assign(it, data);
      if (state.mode === "local") { await idb.put(col, { ...it }); copia.cambio(); }
      render();
    },
    async remove(col, id) {
      if (db) return db.collection(col).doc(id).delete();

  };
  async function guard(fn, okMsg) {

  }

  const armarioNombre = (id) => (state.armarios.find((a) => a.id === id) || {}).nombre || "Sin armario";

  // ---------- Header / tabs ----------
  function renderChrome() {

  // ---------- Prendas ----------
  function filterPrendas(list, f) {

  function filtersHtml(f, scope) {

  }
  function tagHtml(p, opts = {}) {
    const meta = [p.tipo, p.talle && "Talle " + p.talle, p.marca].filter(Boolean).map(esc).join(" · ");
    const dots = (p.colores || []).slice(0, 4).map((c) => `<span class="dot ${c === "Estampado" ? "estampado" : ""}" style="${c === "Estampado" ? "" : "background:" + (HEX[c] || "#ccc")}" title="${esc(c)}"></span>`).join("");

  function viewPrendas() {

      ${state.mode === "local" ? `<section class="panel" style="margin-top:28px">

  // ---------- Generator ----------
  const OCASIONES = ["Cena en un restaurante elegante", "Oficina", "Fin de semana tranquilo", "Fiesta", "Casamiento de día", "Entrenar"];

  function generarLocal(pool, ocasion, lo, hi) {
    const t = (lo + hi) / 2;

    const objetivo = /elegan|cena|restaur|casamiento|evento|formal|gala|teatro/.test(s) ? "Elegante"
      : /fiesta|boliche|cumple|noche/.test(s) ? "Fiesta" : /oficina|trabajo|reuni/.test(s) ? "Oficina"
      : /deport|gym|correr|entren|caminar/.test(s) ? "Deportivo" : "Casual";
    const necesitoAbrigo = t < 12 ? 3 : t < 19 ? 2 : 0;
    const score = (p) => ((p.estilo || []).includes(objetivo) ? 4 : 0) + ((p.estilo || []).includes("Casual") && objetivo === "Casual" ? 1 : 0)
      - (objetivo !== "Deportivo" && (p.estilo || []).includes("Deportivo") ? 3 : 0)
      - (t < 14 && (p.tipo === "Short" || p.abrigo === 1 && tipoCat(p.tipo) === "abrigo") ? 3 : 0)
      - (t > 24 && p.abrigo === 3 ? 4 : 0);
    // Best-scoring garments of a category; options rotate only among the ones that suit the occasion.
    const by = (cat) => {
      const all = pool.filter((p) => tipoCat(p.tipo) === cat).sort((a, b) => score(b) - score(a));
      return all.length ? all.filter((p) => score(p) >= score(all[0]) - 1) : all;
    };
    const arriba = by("arriba"), abajo = by("abajo"), entero = by("entero"), capa = by("capa"), abrigo = by("abrigo").sort((a, b) => Math.abs((a.abrigo || 2) - necesitoAbrigo) - Math.abs((b.abrigo || 2) - necesitoAbrigo) || score(b) - score(a)), calzado = by("calzado"), acc = by("accesorio");
    const pick = (arr, i) => (arr.length ? arr[i % arr.length] : null);
    const nombres = { Elegante: ["Noche impecable", "Elegancia sin esfuerzo", "Clásico que no falla"], Fiesta: ["Listo para la pista", "Brillo justo", "Noche larga"], Oficina: ["Reunión de los lunes", "Prolijo y cómodo", "Modo oficina"], Deportivo: ["A moverse", "Entrenamiento", "Cómodo total"], Casual: ["Domingo tranquilo", "Sale con todo", "Básico que suma"] }[objetivo];
    const res = [], vistos = new Set();
    for (let i = 0; i < 6 && res.length < 3; i++) {
      const items = [];
      const usaEntero = entero.length && (i % 2 === 1 || !arriba.length || !abajo.length) && score(entero[0]) >= 0;

      if (acc.length && i % 2 === 0) items.push(pick(acc, i));
      const ids = [...new Set(items.filter(Boolean).map((p) => p.id))];
      const key = [...ids].sort().join();
      if (ids.length >= 2 && !vistos.has(key)) {
        vistos.add(key);
        res.push({ nombre: nombres[res.length], prendas: ids, nota: `Prioricé prendas ${objetivo.toLowerCase()}s${necesitoAbrigo >= 2 ? " y sumé abrigo por el frío" : t > 24 ? " y livianas por el calor" : ""}.` });
      }
    }
    return res;
  }

      if (!f) return;
      if (editing.preview) URL.revokeObjectURL(editing.preview);
      editing.file = f; editing.preview = URL.createObjectURL(f); editing.quitar = false; dlgChips();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "new-closet") { e.preventDefault(); crearArmario(); }
    if (e.key === "Enter" && e.target.id && e.target.id.startsWith("rename-")) { e.preventDefault(); $(`[data-rename-save="${CSS.escape(e.target.id.slice(7))}"]`)?.click(); }
    if (e.key === "Escape" && e.target.id === "new-closet") { ui.newCloset = false; render(); }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id === "form-prenda") return savePrenda(e);
    if (e.target.id === "gen-form") { e.preventDefault(); generar(); }
  });
  dlg.addEventListener("cancel", (e) => { e.preventDefault(); closePrenda(); });

  // ---------- Boot ----------
  const h = (location.hash || "").slice(1);
  if (["prendas", "armarios", "outfits", "generar"].includes(h)) ui.view = h;
  render();

  async function boot() {
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [d, a, s, u] = await Promise.all([use("db"), use("assets"), use("sample"), use("user")]);
    assets = a; sample = s;
    if (u && u.can) { try { const w = await u.can("data.write"); if (w === false) canWrite = false; } catch (_) {} }
    if (!d) {
      try { await bootLocal(); state.mode = "local"; assets = localAssets; }
      catch (_) { state.mode = "memoria"; }
      render(); return;
    }
    db = d;
    let pending = 3;
    for (const col of ["armarios", "prendas", "outfits"]) {
      db.collection(col).onSnapshot((snap) => {
        state[col] = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        if (!state.loaded[col]) { state.loaded[col] = true; pending--; }
        if (pending <= 0) {
          if (state.mode === "cargando") state.mode = "db";
          if (col === "armarios" && ui.gen.armarios) ui.gen.armarios = ui.gen.armarios.filter((id) => state.armarios.some((x) => x.id === id));
          render();
        }
      }, () => { toast("Se cortó la conexión con el vestidor. Recargá la página."); });
    }
  }
  boot();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
